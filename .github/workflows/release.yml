name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Check version matches tag
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Check and build release APK
        run: >-
          bash ./gradlew --no-daemon --max-workers=1
          detekt ktlintCheck testDebugUnitTest lintDebug lintRelease assembleRelease
      - name: Verify signature and package
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose "$apk"
          signer=$("$build_tools/apksigner" verify --print-certs "$apk" | sed -n 's/Signer #1 certificate SHA-256 digest: //p')
          test "$signer" = "a9b051fb76244dd050e873eb5f45230aaaab74b5a482454b1c8667df2ddf1284"
          "$build_tools/aapt" dump badging "$apk" | sed -n '1p'
          if "$build_tools/aapt" dump permissions "$apk" | grep -q android.permission.INTERNET; then
            exit 1
          fi
          cp "$apk" "backgrounded-${GITHUB_REF_NAME}.apk"
          sha256sum "backgrounded-${GITHUB_REF_NAME}.apk" > "backgrounded-${GITHUB_REF_NAME}.apk.sha256"
          awk 'NR > 1 && /^# v/ { exit } { print }' CHANGELOG.md > release-notes.md
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backgrounded-${{ github.ref_name }}.apk
            backgrounded-${{ github.ref_name }}.apk.sha256
          name: Backgrounded ${{ github.ref_name }}
          body_path: release-notes.md
          make_latest: true
